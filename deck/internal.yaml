# Internal tier (CP mcp-internal) — git is the source of truth.
# Edit here, then: deck gateway sync deck/internal.yaml --konnect-... (see
# compose/phaseN/setup-phaseN.sh). Never edit in the Konnect UI.
_format_version: "3.0"

# Tier wall as a GLOBAL plugin so every route (including the first-party MCP
# server routes) gets it. RFC 6750 semantics: a wrong-tier token is 401
# invalid_token. Token-less requests pass through untouched, so unauthenticated
# Protected Resource Metadata discovery on the MCP routes still works — the MCP
# server itself issues the 401 + WWW-Authenticate challenge.
plugins:
  # Audit spine (contract §9/§A.4, phase 6): every request's traces and the
  # kong.log audit records the bespoke plugins emit (cnf-check, dlp-egress,
  # vendor-token) leave via OTLP to the lab collector → Tempo/Loki. Requires
  # KONG_TRACING_INSTRUMENTATIONS=all on the DP (compose/phase5).
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      logs_endpoint: http://otel-collector:4318/v1/logs
      resource_attributes:
        service.name: kong-internal
  # Cert-bound token enforcement (contract §8, phase 4): if a token carries
  # cnf.x5t#S256 it must arrive over mTLS with the matching client cert —
  # global, like the tier wall, because the certificate phase runs before
  # routing. Custom plugin: plugins/cnf-check (schema registered on the CP
  # by compose/phase4/setup-phase4.sh; DP loads it via KONG_PLUGINS).
  - name: cnf-check
  # DPoP sender-constraint (contract §8, RFC 9449): if a token carries cnf.jkt
  # it must arrive as `Authorization: DPoP <token>` with a fresh, matching proof.
  # Global, like cnf-check and the tier wall; claim-driven so bearer paths are
  # untouched. Custom plugin: plugins/dpop-check (schema on the CP via
  # setup-phase5.sh; DP loads it via KONG_PLUGINS + the dpop_jti shared dict).
  - name: dpop-check
  - name: pre-function
    config:
      access:
        - |
          local cjson = require "cjson.safe"
          local auth = kong.request.get_header("authorization") or ""
          -- Accept both schemes: DPoP-bound tokens (RFC 9449 §7.1) present as
          -- `DPoP <token>`, not `Bearer`. Matching only Bearer here would let a
          -- DPoP-scheme request slip past the tier wall via the no-token return.
          local token = auth:match("^[Bb][Ee][Aa][Rr][Ee][Rr]%s+(.+)$")
            or auth:match("^[Dd][Pp][Oo][Pp]%s+(.+)$")
          if not token then return end -- no token: let the upstream challenge
          local reject = function()
            return kong.response.exit(401, { message = "token not valid for this tier" },
              { ["WWW-Authenticate"] = 'Bearer realm="mcp-internal", error="invalid_token", error_description="tier audience mismatch"' })
          end
          local payload = token:match("^[^.]+%.([^.]+)%.")
          if not payload then return reject() end
          payload = payload:gsub("-", "+"):gsub("_", "/")
          payload = payload .. string.rep("=", (4 - #payload % 4) % 4)
          local raw = ngx.decode_base64(payload)
          local claims = raw and cjson.decode(raw)
          if not claims then return reject() end
          local aud = claims.aud
          if type(aud) == "string" then aud = { aud } end
          for _, a in ipairs(aud or {}) do
            if a == "mcp://tier/internal" then return end
          end
          return reject()

services:
  # Phase 2 placeholder: the tier wall + group ACL proven against HAPI directly.
  # openid-connect here validates signature + tier audience and maps groups to
  # the ACL. The Phase 3 MCP servers below are authoritative for their own
  # audience / scope / group / compartment, so their routes only carry the
  # global tier wall.
  - name: fhir-placeholder
    url: http://hapi:8081/fhir
    routes:
      - name: fhir-internal
        paths:
          - /fhir
        strip_path: true
        # Explicit since Kong 3.14 defaults routes to https only; the DPs
        # serve the bearer paths on plain :8000 (and the m2m path on :8443).
        protocols: [http, https]
    plugins:
      - name: openid-connect
        config:
          issuer: http://keycloak:8080/realms/mcp-plane
          issuers_allowed:
            - http://localhost:8080/realms/mcp-plane
          # Phase 4 pins KC_HOSTNAME, so discovery advertises jwks_uri at
          # localhost:8080 — unreachable from inside the DP. Fetch the keys
          # over the container network as well.
          extra_jwks_uris:
            - http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
          auth_methods:
            - bearer
          audience:
            - mcp://tier/internal
          authenticated_groups_claim:
            - groups
          cache_tokens_salt: mcp-lab-internal-cache-salt
      - name: acl
        config:
          allow:
            - mcp-clinical-tools
          always_use_authenticated_groups: true

  # First-party MCP servers. strip_path leaves /mcp and /.well-known/* for the
  # server; the server enforces its own resource audience, per-tool scope
  # (step-up), group visibility, and (FHIR) patient compartment.
  - name: fhir-clinical
    url: http://fhir-clinical:3000
    routes:
      - name: fhir-clinical-internal
        paths:
          - /fhir-clinical
        strip_path: true
        protocols: [http, https]
    plugins:
      # Coarse abuse ceiling; generous enough for interactive tool use.
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: scheduling
    url: http://scheduling:3000
    routes:
      - name: scheduling-internal
        paths:
          - /scheduling
        strip_path: true
        protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # ---- Egress tier (phase 5): brokered vendor routes ----
  # The service upstream IS the allowlist: only registered vendor hosts are
  # routable, there is no open proxy. Plugin order (by priority):
  # openid-connect (1050, audience = the egress resource) -> dlp-egress
  # (950, nothing unscreened leaves) -> vendor-token (900, broker resolve +
  # vendor credential injection; the hub JWT is stripped upstream).
  - name: egress-github
    url: https://api.githubcopilot.com/mcp
    routes:
      - name: egress-github
        paths:
          - /egress/github
        strip_path: true
        protocols: [http, https]
    plugins:
      - name: openid-connect
        config:
          issuer: http://keycloak:8080/realms/mcp-plane
          issuers_allowed:
            - http://localhost:8080/realms/mcp-plane
          extra_jwks_uris:
            - http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
          auth_methods:
            - bearer
          audience:
            - mcp://egress/github
          cache_tokens_salt: mcp-lab-egress-github-salt
      - name: dlp-egress
        config:
          patterns:
            - name: mrn
              regex: MRN-\d{7}
            - name: ssn
              regex: \b\d{3}-\d{2}-\d{4}\b
      - name: vendor-token
        config:
          broker_url: http://broker:8300
          vendor: github
          min_ttl_s: 120
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  - name: egress-mockhub
    url: http://mock-vendor:8310/mcp
    routes:
      - name: egress-mockhub
        paths:
          - /egress/mockhub
        strip_path: true
        protocols: [http, https]
    plugins:
      - name: openid-connect
        config:
          issuer: http://keycloak:8080/realms/mcp-plane
          issuers_allowed:
            - http://localhost:8080/realms/mcp-plane
          extra_jwks_uris:
            - http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
          auth_methods:
            - bearer
          audience:
            - mcp://egress/mockhub
          cache_tokens_salt: mcp-lab-egress-mockhub-salt
      - name: dlp-egress
        config:
          patterns:
            - name: mrn
              regex: MRN-\d{7}
            - name: ssn
              regex: \b\d{3}-\d{2}-\d{4}\b
      - name: vendor-token
        config:
          broker_url: http://broker:8300
          vendor: mockhub
          min_ttl_s: 30
          required_scopes:
            - issues:read
            - issues:write
      - name: rate-limiting
        config:
          minute: 120
          policy: local
