# External tier (CP mcp-external) — git is the source of truth.
# Edit here, then: deck gateway sync deck/external.yaml --konnect-... (see
# compose/phaseN/setup-phaseN.sh). Never edit in the Konnect UI.
_format_version: "3.0"

# Global external-tier wall (see deck/internal.yaml): 401 invalid_token for a
# cross-tier replay; token-less requests pass so MCP PRM discovery works.
plugins:
  # Audit spine (contract §9/§A.4, phase 6): traces + kong.log records via
  # OTLP to the lab collector → Tempo/Loki.
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      logs_endpoint: http://otel-collector:4318/v1/logs
      resource_attributes:
        service.name: kong-external
  - name: pre-function
    config:
      access:
        - |
          local cjson = require "cjson.safe"
          local auth = kong.request.get_header("authorization") or ""
          local token = auth:match("^[Bb]earer%s+(.+)$")
          if not token then return end -- no token: let the upstream challenge
          local reject = function()
            return kong.response.exit(401, { message = "token not valid for this tier" },
              { ["WWW-Authenticate"] = 'Bearer realm="mcp-external", error="invalid_token", error_description="tier audience mismatch"' })
          end
          local payload = token:match("^[^.]+%.([^.]+)%.")
          if not payload then return reject() end
          payload = payload:gsub("-", "+"):gsub("_", "/")
          payload = payload .. string.rep("=", (4 - #payload % 4) % 4)
          local raw = ngx.decode_base64(payload)
          local claims = raw and cjson.decode(raw)
          if not claims then return reject() end
          local aud = claims.aud
          if type(aud) == "string" then aud = { aud } end
          for _, a in ipairs(aud or {}) do
            if a == "mcp://tier/external" then return end
          end
          return reject()

services:
  - name: fhir-placeholder
    url: http://hapi:8081/fhir
    routes:
      - name: fhir-external
        paths:
          - /fhir
        strip_path: true
    plugins:
      - name: openid-connect
        config:
          issuer: http://keycloak:8080/realms/mcp-plane
          issuers_allowed:
            - http://localhost:8080/realms/mcp-plane
          # Phase 4 pins KC_HOSTNAME, so discovery advertises jwks_uri at
          # localhost:8080 — unreachable from inside the DP. Fetch the keys
          # over the container network as well.
          extra_jwks_uris:
            - http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
          auth_methods:
            - bearer
          audience:
            - mcp://tier/external
          authenticated_groups_claim:
            - groups
          cache_tokens_salt: mcp-lab-external-cache-salt
      - name: acl
        config:
          allow:
            - mcp-external-curated
          always_use_authenticated_groups: true

  # Patient-facing access to the FHIR clinical server (Auth0 end customers).
  # The server enforces the fhir_patient compartment; the tier wall is global.
  - name: fhir-clinical
    url: http://fhir-clinical:3000
    routes:
      - name: fhir-clinical-external
        paths:
          - /fhir-clinical
        strip_path: true
