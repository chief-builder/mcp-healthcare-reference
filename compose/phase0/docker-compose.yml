name: mcp-phase0

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      PHASE0_CLIENT_SECRET: ${PHASE0_CLIENT_SECRET}
      # The shared realm export brokers Auth0 (phase 1+); its URLs must parse
      # even when the Auth0 leg is not configured, or the import aborts.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-auth0-not-configured.invalid}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-not-configured}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-not-configured}
    volumes:
      - ../../realm/mcp-plane.json:/opt/keycloak/data/import/mcp-plane.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  hapi:
    image: hapiproject/hapi:v8.12.0-1
    environment:
      # dotted keys on purpose: spring.jpa.properties.* is a Map — uppercase
      # underscore env names do not bind to its dotted keys
      "spring.datasource.url": jdbc:postgresql://postgres:5432/hapi
      "spring.datasource.username": hapi
      "spring.datasource.password": ${POSTGRES_PASSWORD}
      "spring.datasource.driverClassName": org.postgresql.Driver
      "spring.jpa.properties.hibernate.dialect": ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      "hapi.fhir.fhir_version": R4
      # listen on 8081 inside the container too, so the tester UI's links
      # (built from server_address) work both in-container and from the host
      "server.port": "8081"
      "hapi.fhir.tester.home.server_address": http://localhost:8081/fhir
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo

volumes:
  postgres-data:
  loki-data:
  tempo-data:
  grafana-data:
