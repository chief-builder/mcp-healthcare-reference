# Generic SNI-passthrough proxy for the DP -> Konnect uplink.
#
# The compose service carries network aliases equal to the real Konnect
# cluster/telemetry hostnames, so DP traffic lands here with correct SNI and
# Host. We forward by SNI to the real host, resolved via public DNS (1.1.1.1)
# on purpose: Docker's embedded DNS would resolve the alias back to this
# container and loop.
#
# 'docker compose stop cp-uplink' = severed CP uplink (phase 2 acceptance).
worker_processes 1;
events { worker_connections 256; }
stream {
  resolver 1.1.1.1 valid=60s;
  server {
    listen 443;
    ssl_preread on;
    proxy_pass $ssl_preread_server_name:443;
  }
}
