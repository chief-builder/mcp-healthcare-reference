name: mcp-phase5

# Phase 5 stack: the phase 4 stack (cert-bound m2m, k3d/SPIRE workload side)
# plus the egress centerpiece:
#   - vault (OpenBao dev mode): vendor-tokens/ + vendor-clients/ KV v2 custody
#   - broker: the Vendor Token Broker (broker/, per
#     docs/vendor-token-broker-design.md); host :8300 for the browser consent
#     endpoints, compose network for the DP resolve path
#   - mock-vendor: mockhub AS + fake vendor MCP endpoint (60s tokens,
#     rotating refresh) so the single-flight/revocation gates run headless
#   - kong-internal additionally loads the dlp-egress + vendor-token plugins
# Keycloak/Kong mTLS surfaces are unchanged from phase 4.
# Bring-up: ./setup-phase5.sh (also creates the k3d side, as in phase 4).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../phase0/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      KC_FEATURES: token-exchange:v1,admin-fine-grained-authz:v1,dpop
      # Cert-bound m2m (contract §6.3): mTLS-capable HTTPS listener. The
      # truststore is the lab CA that signs SPIRE's intermediate, so SVID
      # chains validate at the TLS layer before client-x509 matching runs.
      KC_HTTPS_CERTIFICATE_FILE: /mtls-certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /mtls-certs/keycloak.key
      KC_HTTPS_CLIENT_AUTH: request
      KC_TRUSTSTORE_PATHS: /mtls-certs/lab-ca.crt
      # Pin the issuer: tokens minted over 8443 (m2m) must carry the same
      # iss the servers and DPs already validate.
      KC_HOSTNAME: http://localhost:8080
      PHASE0_CLIENT_SECRET: ${PHASE0_CLIENT_SECRET}
      FAKE_PING_PASSWORD: ${FAKE_PING_PASSWORD}
      FAKE_PING_BROKER_SECRET: ${FAKE_PING_BROKER_SECRET}
      LEGACY_EXCHANGE_SECRET: ${LEGACY_EXCHANGE_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-auth0-not-configured.invalid}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-not-configured}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-not-configured}
    volumes:
      - ../../realm:/opt/keycloak/data/import:ro
      - ./certs:/mtls-certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy

  homegrown-issuer:
    build: ../phase1/homegrown-issuer
    environment:
      HOMEGROWN_CLIENT_SECRET: ${HOMEGROWN_CLIENT_SECRET}
    ports:
      - "7001:7000"

  hapi:
    image: hapiproject/hapi:v8.0.0
    environment:
      "spring.datasource.url": jdbc:postgresql://postgres:5432/hapi
      "spring.datasource.username": hapi
      "spring.datasource.password": ${POSTGRES_PASSWORD}
      "spring.datasource.driverClassName": org.postgresql.Driver
      "spring.jpa.properties.hibernate.dialect": ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      "hapi.fhir.fhir_version": R4
      "server.port": "8081"
      "hapi.fhir.tester.home.server_address": http://localhost:8081/fhir
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  fhir-clinical:
    build: ../../servers/fhir-clinical
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_BASE_URL: http://localhost:8100/fhir-clinical
      MCP_RESOURCE_URI: mcp://srv/fhir-clinical
      MCP_AUTHORIZATION_SERVERS: http://localhost:8080/realms/mcp-plane
      MCP_ISSUER: http://localhost:8080/realms/mcp-plane
      MCP_JWKS_URI: http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
    depends_on:
      - keycloak

  scheduling:
    build: ../../servers/scheduling
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_BASE_URL: http://localhost:8100/scheduling
      MCP_RESOURCE_URI: mcp://srv/scheduling
      MCP_AUTHORIZATION_SERVERS: http://localhost:8080/realms/mcp-plane
      MCP_ISSUER: http://localhost:8080/realms/mcp-plane
      MCP_JWKS_URI: http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
      DATABASE_URL: postgres://scheduling:${POSTGRES_PASSWORD}@postgres:5432/scheduling
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  kong-internal:
    image: kong/kong-gateway:3.9
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CERT: /certs/internal.crt
      KONG_CLUSTER_CERT_KEY: /certs/internal.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson.safe
      # TLS proxy listener for the m2m path (cnf binding needs to see the
      # client cert); 8000 stays for the phase 0-3 bearer paths.
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_SSL_CERT: /certs/kong-internal.crt
      KONG_SSL_CERT_KEY: /certs/kong-internal.key
      KONG_PLUGINS: bundled,cnf-check,dlp-egress,vendor-token,dpop-check
      KONG_LUA_PACKAGE_PATH: /opt/kong-plugins/?.lua;;
      # DPoP proof replay cache (dpop-check); single-entry DP → authoritative.
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "dpop_jti 5m"
      KONG_STATUS_LISTEN: 0.0.0.0:8007
      # Audit spine (phase 6): produce spans for the opentelemetry plugin
      # (deck/internal.yaml) to export; sample everything — this is a lab.
      KONG_TRACING_INSTRUMENTATIONS: "all"
      KONG_TRACING_SAMPLING_RATE: "1.0"
    env_file:
      - path: ./generated/dp-internal.env
        required: false
    volumes:
      - ./certs:/certs:ro
      - ../../plugins/cnf-check:/opt/kong-plugins/kong/plugins/cnf-check:ro
      - ../../plugins/dlp-egress:/opt/kong-plugins/kong/plugins/dlp-egress:ro
      - ../../plugins/vendor-token:/opt/kong-plugins/kong/plugins/vendor-token:ro
      - ../../plugins/dpop-check:/opt/kong-plugins/kong/plugins/dpop-check:ro
    ports:
      - "8100:8000"
      - "8143:8443"
    depends_on:
      - cp-uplink

  kong-external:
    image: kong/kong-gateway:3.9
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CERT: /certs/external.crt
      KONG_CLUSTER_CERT_KEY: /certs/external.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: cjson.safe
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8007
      KONG_TRACING_INSTRUMENTATIONS: "all"
      KONG_TRACING_SAMPLING_RATE: "1.0"
    env_file:
      - path: ./generated/dp-external.env
        required: false
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8200:8000"
    depends_on:
      - cp-uplink

  vault:
    image: openbao/openbao:2
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8210:8200"

  broker:
    build: ../../broker
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-unprovisioned}
      BROKER_PUBLIC_URL: http://localhost:8300
      HUB_ISSUER: http://localhost:8080/realms/mcp-plane
      HUB_JWKS_URI: http://keycloak:8080/realms/mcp-plane/protocol/openid-connect/certs
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      MCP_ADMIN_ISSUER: http://localhost:8080/realms/mcp-plane
    ports:
      - "8300:8300"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      - vault
      - keycloak

  mock-vendor:
    build: ./mock-vendor
    environment:
      MOCK_PUBLIC_URL: http://localhost:8310
      MOCK_INTERNAL_URL: http://mock-vendor:8310
      MOCK_CLIENT_ID: mcp-lab-broker
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET}
      MOCK_AT_TTL: "60"
    ports:
      - "8310:8310"

  cp-uplink:
    image: nginx:1.27-alpine
    volumes:
      - ../phase2/uplink.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases:
          - ${INT_CLUSTER_HOST:-int-cluster.unset.invalid}
          - ${INT_TELEMETRY_HOST:-int-telemetry.unset.invalid}
          - ${EXT_CLUSTER_HOST:-ext-cluster.unset.invalid}
          - ${EXT_TELEMETRY_HOST:-ext-telemetry.unset.invalid}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ../phase0/otel/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../phase0/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../phase0/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  # Audit spine (phase 6): ships every container's stdout/stderr to Loki via
  # the Docker API — the broker, MCP servers, and mock vendor emit one JSON
  # audit line per event on stdout by design (broker/app/audit.py), and this
  # is how they reach the SIEM substitute. Kong's own audit records travel
  # OTLP instead (opentelemetry plugin in deck/), unwrapped from the error log.
  alloy:
    image: grafana/alloy:v1.5.1
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../phase0/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo

volumes:
  postgres-data:
  loki-data:
  tempo-data:
  grafana-data:
