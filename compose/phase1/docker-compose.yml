name: mcp-phase1

# Phase 1 stack: phase 0 services (infra configs bind-mounted from ../phase0 —
# single source of truth) + the fake-ping realm import, identity brokering,
# and the toy homegrown issuer for the RFC 8693 exchange leg.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../phase0/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      # explicit :v1 — the legacy external->internal exchange needs V1 FGAP;
      # unversioned names resolve to V2 on KC 26.2+
      KC_FEATURES: token-exchange:v1,admin-fine-grained-authz:v1
      # realm-import placeholder substitution
      PHASE0_CLIENT_SECRET: ${PHASE0_CLIENT_SECRET}
      FAKE_PING_PASSWORD: ${FAKE_PING_PASSWORD}
      FAKE_PING_BROKER_SECRET: ${FAKE_PING_BROKER_SECRET}
      LEGACY_EXCHANGE_SECRET: ${LEGACY_EXCHANGE_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-auth0-not-configured.invalid}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-not-configured}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-not-configured}
    volumes:
      - ../../realm:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  homegrown-issuer:
    build: ./homegrown-issuer
    environment:
      HOMEGROWN_CLIENT_SECRET: ${HOMEGROWN_CLIENT_SECRET}
    ports:
      # host 7001: macOS AirPlay squats on 7000; in-network URLs still use 7000
      - "7001:7000"

  hapi:
    image: hapiproject/hapi:v8.0.0
    environment:
      # dotted keys on purpose: spring.jpa.properties.* is a Map — uppercase
      # underscore env names do not bind to its dotted keys
      "spring.datasource.url": jdbc:postgresql://postgres:5432/hapi
      "spring.datasource.username": hapi
      "spring.datasource.password": ${POSTGRES_PASSWORD}
      "spring.datasource.driverClassName": org.postgresql.Driver
      "spring.jpa.properties.hibernate.dialect": ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      "hapi.fhir.fhir_version": R4
      # listen on 8081 inside the container too, so the tester UI's links
      # (built from server_address) work both in-container and from the host
      "server.port": "8081"
      "hapi.fhir.tester.home.server_address": http://localhost:8081/fhir
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ../phase0/otel/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../phase0/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../phase0/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../phase0/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo

volumes:
  postgres-data:
  loki-data:
  tempo-data:
  grafana-data:
