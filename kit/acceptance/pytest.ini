[pytest]
testpaths = probes
python_files = test_*.py
markers =
    identity: IDN-* — single issuer, token shape, no PII
    tier: TIER-* — audience discipline and tier isolation
    sender_constraint: SC-* — DPoP / mTLS proof of possession
    authorization: AZ-* — tool-layer scope, group, compartment
    statelessness: ST-* — no protocol session
    egress: EG-* — governed egress, DLP, broker
    audit: AU-* — jti-joinable audit spine
    vectors: claim-shape unit layer
    redteam: adversarial probe — requires signed rules of engagement (see RULES-OF-ENGAGEMENT.md)
addopts = -ra --strict-markers
